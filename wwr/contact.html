<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Company Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section>
            <h2>Company Information</h2>
            <p><strong>Address:</strong> 123 River Road, Adventure City</p>
            <p><strong>Phone:</strong> (123) 456-7890</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>
        </section>

        <section>
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg"
                  alt="River guide helping guests prepare for rafting">
                <figcaption>River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg"
                  alt="Customer service representative assisting visitors">
                <figcaption>Customer Service Representative</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg"
                  alt="Rafting instructor demonstrating safety procedures">
                <figcaption>Rafting Instructor</figcaption>
            </figure>
        </section>

        <section>
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <div>
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <input type="radio" id="general" name="purpose" value="general">
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="website" name="purpose" value="website">
                    <label for="website">Website Suggestion</label>
                </fieldset>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <div>
                    <button type="submit">Send Message</button>
                </div>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Julia Masilela</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook social media icon">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter social media icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram social media icon">
            </a>
        </nav>
    </footer>

</body>

</html>
