<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>White Water Rafting | Home</title>

    <meta name="description"
      content="Experience exciting white water rafting adventures for families, beginners, and thrill seekers.">

    <meta name="author" content="Julia Masilela">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- HERO -->
        <section class="hero">
            <img src="images/hero.jpg" alt="Rafting Adventure">
            <h1>Experience the Adventure of a Lifetime</h1>
        </section>

        <!-- NEWSLETTER -->
        <section class="newsletter">
            <h2>Join Our Newsletter</h2>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <button type="submit">Sign Up</button>
            </form>
        </section>

        <!-- CTA -->
        <section class="cta">
            <h2>Ready for Adventure?</h2>
            <a class="button" href="trips.html">View Our Trips</a>
        </section>

        <!-- GRID -->
        <section class="home-grid">

            <div class="grid-item">
                <img src="images/family.jpg" alt="Family rafting">
                <h3>Family Fun</h3>
                <p>Safe and exciting trips for all ages.</p>
            </div>

            <div class="grid-item">
                <img src="images/rapids.jpg" alt="Rapids adventure">
                <h3>Extreme Rapids</h3>
                <p>Challenge yourself with thrilling waters.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Julia Masilela</p>

        <div class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
        </div>
    </footer>

</body>

</html>
