<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting for reservations, questions, trip information, and customer support.">

    <meta name="author" content="Julia Masilela">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>White Water Rafting Contact Us</h1>

        <section>
            <h2>Contact Information</h2>
            <p>Address: 123 River Road, Idaho</p>
            <p>Phone: (208) 555-1234</p>
            <p>Email: info@whitewaterrafting.com</p>
        </section>

        <section>
            <h2>Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Sarah Johnson, General Manager">
                <figcaption>Sarah Johnson - General Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Michael Smith, Lead Guide">
                <figcaption>Michael Smith - Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Emma Davis, Reservations Manager">
                <figcaption>Emma Davis - Reservations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/rafting1.jpg" alt="Rafting adventure group">
                <figcaption>Adventure Team</figcaption>
            </figure>
        </section>

        <section>
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <p>Purpose of Message</p>

                <label><input type="radio" name="purpose"> General Inquiry</label>
                <label><input type="radio" name="purpose"> Reservation Question</label>
                <label><input type="radio" name="purpose"> Website Suggestion</label>

                <label for="message">Message</label>
                <textarea id="message"></textarea>

                <label>
                    <input type="checkbox">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Julia Masilela</p>

        <nav>
            <a href="https://facebook.com">Facebook</a>
            <a href="https://instagram.com">Instagram</a>
            <a href="https://twitter.com">Twitter</a>
        </nav>
    </footer>

</body>

</html>
